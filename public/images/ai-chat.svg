<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    .primary { fill: #4F46E5; }
    .secondary { fill: #818CF8; }
    .accent { fill: #C7D2FE; }
    .dark { fill: #1E293B; }
    .light { fill: #E0E7FF; }
  </style>
  <rect width="800" height="600" fill="#0F172A" />
  <g transform="translate(100, 100)">
    <!-- AI Brain -->
    <circle cx="300" cy="150" r="120" class="primary" />
    <circle cx="300" cy="150" r="110" class="dark" />
    
    <!-- Brain Circuit Pattern -->
    <path d="M250,100 Q300,50 350,100" stroke="#818CF8" stroke-width="3" fill="none" />
    <path d="M250,200 Q300,150 350,200" stroke="#818CF8" stroke-width="3" fill="none" />
    <path d="M250,300 Q300,250 350,300" stroke="#818CF8" stroke-width="3" fill="none" />
    
    <!-- Circuit Nodes -->
    <circle cx="250" cy="100" r="5" class="secondary" />
    <circle cx="350" cy="100" r="5" class="secondary" />
    <circle cx="250" cy="200" r="5" class="secondary" />
    <circle cx="350" cy="200" r="5" class="secondary" />
    <circle cx="250" cy="300" r="5" class="secondary" />
    <circle cx="350" cy="300" r="5" class="secondary" />
    
    <!-- Chat Interface -->
    <rect x="100" y="400" width="400" height="100" rx="10" class="dark" />
    <rect x="120" y="420" width="360" height="60" rx="5" class="light" />
    
    <!-- Typing Indicator -->
    <circle cx="140" cy="450" r="5" class="secondary" />
    <circle cx="160" cy="450" r="5" class="secondary" />
    <circle cx="180" cy="450" r="5" class="secondary" />
    
    <!-- Connection Lines -->
    <path d="M300,270 L300,400" stroke="#818CF8" stroke-width="3" fill="none" stroke-dasharray="5,5" />
    
    <!-- Floating Elements -->
    <circle cx="500" cy="200" r="20" class="secondary" opacity="0.7" />
    <circle cx="150" cy="150" r="15" class="accent" opacity="0.7" />
    <circle cx="450" cy="300" r="25" class="primary" opacity="0.5" />
    <circle cx="200" cy="250" r="10" class="secondary" opacity="0.7" />
  </g>
</svg> 